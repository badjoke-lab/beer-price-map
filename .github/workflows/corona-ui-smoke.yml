name: Corona UI smoke

on:
  push:
    branches:
      - build/corona-production
      - main
      - feat/market-layer-r1
    paths:
      - 'apps/corona-price-map/**'
      - 'scripts/build-corona-site.mjs'
      - 'scripts/build-corona-history-summary.py'
      - 'scripts/build-fx-history-summary.mjs'
      - 'scripts/fetch-corona-fx.mjs'
      - 'scripts/fetch-corona-markets.mjs'
      - 'scripts/smoke-corona-site.mjs'
      - 'scripts/smoke-selection-connectors.mjs'
      - '.github/workflows/corona-ui-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/corona-price-map/**'
      - 'scripts/build-corona-site.mjs'
      - 'scripts/build-corona-history-summary.py'
      - 'scripts/build-fx-history-summary.mjs'
      - 'scripts/fetch-corona-fx.mjs'
      - 'scripts/fetch-corona-markets.mjs'
      - 'scripts/smoke-corona-site.mjs'
      - 'scripts/smoke-selection-connectors.mjs'
      - '.github/workflows/corona-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check apps/corona-price-map/app-v2.js
          node --check apps/corona-price-map/markets-v1.js
          node --check apps/corona-price-map/motion-r2.js
          node --check apps/corona-price-map/selection-connectors.js
          node --check scripts/fetch-corona-fx.mjs
          node --check scripts/fetch-corona-markets.mjs
          node --check scripts/build-fx-history-summary.mjs
          node --check scripts/build-corona-site.mjs
          node --check scripts/smoke-corona-site.mjs
          node --check scripts/smoke-selection-connectors.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh derived UI data
        run: |
          node scripts/fetch-corona-markets.mjs
          node scripts/fetch-corona-fx.mjs
          node scripts/build-fx-history-summary.mjs
          python scripts/build-corona-history-summary.py
          node scripts/build-corona-site.mjs
      - name: Browser smoke
        run: node scripts/smoke-corona-site.mjs
      - name: Connected selection smoke
        run: node scripts/smoke-selection-connectors.mjs
      - name: Upload accepted screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corona-ui-smoke
          path: smoke-artifacts/*.png
          if-no-files-found: error
