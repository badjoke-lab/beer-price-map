name: Market scope branch check

on:
  push:
    branches:
      - feat/market-scope-r1

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          python -m py_compile scripts/publish-corona-production.py scripts/build-corona-history-summary.py
          node --check scripts/check-market-scope.mjs
      - name: Validate market scope config
        run: node scripts/check-market-scope.mjs
