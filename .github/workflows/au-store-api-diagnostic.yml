name: Dan Murphy store API diagnostic

on:
  push:
    branches:
      - research/major-market-probes-r1
    paths:
      - scripts/diagnose-danmurphys-store-api.mjs
      - scripts/diagnose-danmurphys-store-switch.mjs
      - .github/workflows/au-store-api-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/diagnose-danmurphys-store-api.mjs
          node --check scripts/diagnose-danmurphys-store-switch.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture current Dan Murphy API/session
        run: node scripts/diagnose-danmurphys-store-api.mjs
      - name: Attempt deterministic Sydney store switch
        run: node scripts/diagnose-danmurphys-store-switch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: au-store-api-diagnostic
          path: |
            au-store-api-diagnostic/**
            au-store-switch-diagnostic/**
          if-no-files-found: error
